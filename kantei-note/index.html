<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鑑定ノート — 苦手を、得意に。</title><link rel="stylesheet" href="style.css?v=2"><body><aside><a class="brand" href="#home"><span class="logo">◇</span> 鑑定ノート<small>KANTEI NOTE</small></a><div class="navlabel">WORKSPACE</div><nav><button data-page="home">▦ <span>ホーム</span></button><button data-page="study">▷ <span>学習する</span></button><button data-page="questions">▤ <span>問題ライブラリ</span></button><button data-page="history">◷ <span>学習記録</span></button></nav><div class="sidebottom"><div class="leaf">✧</div><b>小さな積み重ねが、確かな力に。</b><p>今日も、自分のペースで。</p><span class="local">● このブラウザに自動保存</span></div></aside><div class="workspace"><header><span>マイワークスペース <i>/</i> <b id="crumb">ホーム</b></span><button class="avatar" aria-label="問題を登録" onclick="openEditor()">＋</button></header><main id="main"></main><footer>鑑定ノート <span>一問ずつ、理解を深める。</span></footer></div><dialog id="editor"><form id="form"><div class="dialoghead"><h2 id="formtitle">問題を登録</h2><button type="button" class="plain" aria-label="閉じる" onclick="closeEditor()">✕</button></div><section class="photo-section" aria-label="写真から登録"><div class="sectiontitle"><h2>写真から登録</h2><span class="pill green">日本語・英語</span></div><p class="photo-help">問題の写真を選んで、文字を読み取れます。写真のまま保存することもできます。</p><div class="photo-actions"><label class="secondary photo-picker" for="photo-file">▧ 写真を選ぶ</label><label class="secondary photo-picker" for="photo-camera">◎ 撮影する</label><input id="photo-file" type="file" accept="image/*" hidden><input id="photo-camera" type="file" accept="image/*" capture="environment" hidden></div><div id="photo-preview" hidden><button type="button" class="photo-preview-button" onclick="viewPhoto(editorPhoto)" aria-label="写真を拡大"><img id="editor-image" alt="登録する問題の写真"></button><div class="photo-actions"><button type="button" id="read-photo" class="secondary" onclick="readPhoto()">写真から問題文を読み取る</button><button type="button" id="cancel-ocr" class="plain" onclick="cancelOCR()" hidden>読み取りを中止</button><button type="button" id="remove-photo" class="plain" onclick="clearPhoto()">写真を外す</button></div></div><p id="photo-status" class="photo-help" role="status" aria-live="polite"></p><p class="photo-help">答えが写らないように、1枚につき1問を撮影してください。読み取った文字と正解を確認してから保存してください。</p></section><label>分野<input name="category" required placeholder="例：宝石鑑定" maxlength="50"></label><label>問題<textarea name="question" required rows="3" placeholder="覚えたい問題を入力" maxlength="3000"></textarea></label><label>正解<textarea name="answer" required rows="2" placeholder="正解を入力" maxlength="3000"></textarea></label><label>解説・メモ<textarea name="note" rows="2" placeholder="理解のポイント（任意）" maxlength="5000"></textarea></label><button class="primary" type="submit">保存する</button></form></dialog><div id="toast" role="status"></div><dialog id="photo-viewer"><div class="dialoghead"><h2>問題の写真</h2><button type="button" class="plain" aria-label="閉じる" onclick="document.querySelector('#photo-viewer').close()">✕</button></div><img id="full-photo" alt="問題の写真（拡大）"></dialog><script src="photo.js?v=2"></script><script src="app.js?v=2"></script></body></html>
