<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>服ノート</title><link rel="stylesheet" href="notes.css"><script defer src="notes.js"></script></head><body data-app="clothes"><header><nav aria-label="ノート切り替え"><a href="index.html">シネマ棚</a><a href="clothes.html" aria-current="page">服ノート</a><a href="todo.html" >やることリスト</a></nav></header><main><h1>服ノート</h1><p>持っている服や着たい組み合わせを、自分だけのノートに。<br>記録はこのブラウザに保存されます。大切なデータはJSONでバックアップしてください。</p><section class="panel" aria-labelledby="form-title"><h2 id="form-title">新しく登録</h2><form id="entry-form"><label>服の名前<input name="name" required maxlength="120" placeholder="例：白いリネンシャツ"></label><label>カテゴリ<select name="category"><option>トップス</option><option>ボトムス</option><option>ワンピース</option><option>アウター</option><option>靴</option><option>小物</option><option>その他</option></select></label><label>色<input name="color" maxlength="80" placeholder="例：アイボリー"></label><label>ブランド<input name="brand" maxlength="100" placeholder="任意"></label><label class="wide">メモ<textarea name="memo" maxlength="2000" placeholder="サイズ、お手入れ、コーディネートなど"></textarea></label><div class="wide actions"><button class="primary" type="submit">保存する</button><button id="cancel" type="button" hidden>編集をやめる</button></div></form></section><div class="toolbar"><input id="search" type="search" aria-label="検索" placeholder="名前やメモで検索"><select id="filter" aria-label="表示の絞り込み"><option value="all">すべてのカテゴリ</option><option>トップス</option><option>ボトムス</option><option>ワンピース</option><option>アウター</option><option>靴</option><option>小物</option><option>その他</option></select><button id="backup">JSONを書き出す</button><label>JSONを読み込む<input id="restore" type="file" accept="application/json,.json"></label></div><p id="message" role="status" aria-live="polite"></p><p id="count"></p><section id="entries" aria-label="登録した記録"></section></main></body></html>
