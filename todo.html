<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>やることリスト</title><link rel="stylesheet" href="notes.css"><script defer src="notes.js"></script></head><body data-app="todo"><header><nav aria-label="ノート切り替え"><a href="index.html">シネマ棚</a><a href="clothes.html" >服ノート</a><a href="todo.html" aria-current="page">やることリスト</a></nav></header><main><h1>やることリスト</h1><p>今日のことも、いつかのことも。一つずつ片づけよう。<br>記録はこのブラウザに保存されます。大切なデータはJSONでバックアップしてください。</p><section class="panel" aria-labelledby="form-title"><h2 id="form-title">新しく登録</h2><form id="entry-form"><label>やること<input name="name" required maxlength="120" placeholder="例：クリーニングを受け取る"></label><label>期限<input name="due" type="date"></label><label>優先度<select name="priority"><option>通常</option><option>高い</option><option>低い</option></select></label><label class="wide">メモ<textarea name="memo" maxlength="2000" placeholder="手順や覚えておきたいこと"></textarea></label><div class="wide actions"><button class="primary" type="submit">保存する</button><button id="cancel" type="button" hidden>編集をやめる</button></div></form></section><div class="toolbar"><input id="search" type="search" aria-label="検索" placeholder="名前やメモで検索"><select id="filter" aria-label="表示の絞り込み"><option value="all">すべて</option><option value="open">未完了</option><option value="done">完了</option></select><button id="backup">JSONを書き出す</button><label>JSONを読み込む<input id="restore" type="file" accept="application/json,.json"></label></div><p id="message" role="status" aria-live="polite"></p><p id="count"></p><section id="entries" aria-label="登録した記録"></section></main></body></html>
